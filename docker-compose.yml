version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: test123
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - env/api.env

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://test123:password@db:5432/news_db
      PYTHONPATH: /app
    volumes:
      - ./app:/app
    ports:
      - "8000:8000" 

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pytest", "tests"]
    depends_on:
      - db
    volumes:
      - ./app:/app
      - ./tests:/app/tests
    env_file:
      - env/api.env

volumes:
  postgres_data:
